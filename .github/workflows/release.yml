name: macOS Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_release:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install dependencies
        run: |
          go mod download
          go install fyne.io/tools/cmd/fyne@latest

      # App name, ID and icon come from FyneApp.toml, so the output is always
      # "KeyVault Manager.app". Tags like "v1.2.3" or "v.1.2.3" set the version.
      - name: Build and Package App
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION#.}"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            fyne package -os darwin --app-version "$VERSION"
          else
            fyne package -os darwin
          fi

      # Guard against shipping a stale bundle: the binary must have been built
      # from this repository's module.
      - name: Verify Fresh Build
        run: |
          MODULE="$(go list -m)"
          go version -m "KeyVault Manager.app/Contents/MacOS/keyvault-manager" | grep -q "path[[:space:]]*$MODULE\$" \
            || { echo "Packaged binary was not built from $MODULE"; exit 1; }

      # Ad-hoc sign the whole bundle. Without this the bundle only carries the
      # Go linker's binary signature, and Gatekeeper reports the downloaded
      # app as "damaged". Users still need to clear the quarantine attribute
      # (see README) since the app is not notarized.
      - name: Ad-hoc Sign App
        run: |
          codesign --force --deep --sign - "KeyVault Manager.app"
          codesign --verify --deep --strict --verbose=2 "KeyVault Manager.app"

      - name: Archive Application
        run: |
          tar -czf KeyVault-Manager-macOS.tar.gz "KeyVault Manager.app"

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: KeyVault-Manager-macOS.tar.gz
          generate_release_notes: true
