name: macOS Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_release:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Install dependencies
        run: |
          go mod download
          go install fyne.io/fyne/v2/cmd/fyne@latest

      - name: Build and Package App
        run: |
          fyne package -os darwin -icon Icon.png

      # Ad-hoc sign the whole bundle. Without this the bundle only carries the
      # Go linker's binary signature, and Gatekeeper reports the downloaded
      # app as "damaged". Users still need to clear the quarantine attribute
      # (see README) since the app is not notarized.
      - name: Ad-hoc Sign App
        run: |
          codesign --force --deep --sign - "KeyVault Manager.app"
          codesign --verify --deep --strict --verbose=2 "KeyVault Manager.app"

      - name: Archive Application
        run: |
          tar -czf KeyVault-Manager-macOS.tar.gz "KeyVault Manager.app"

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: KeyVault-Manager-macOS.tar.gz
          generate_release_notes: true
